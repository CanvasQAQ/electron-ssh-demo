<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>Relay · Connection controls</title><link rel="stylesheet" href="floating.css"><script src="floating.js" defer></script></head>
<body><button id="launcher" aria-label="Open connection controls" aria-expanded="false" title="Connection status · Click to expand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 20h8M12 16v4M8 10h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="launcher-status" class="signal"></span></button><section id="card" class="float-card" hidden aria-label="Connection controls"><div class="heading"><span id="orb" class="orb"></span><div class="identity"><strong id="host-label">Host</strong><span id="status" role="status" aria-live="polite">Connection status</span></div><button id="collapse" class="more" aria-label="Collapse connection controls" title="Collapse (Esc)">×</button></div><p id="detail" aria-live="polite"></p><div class="actions"><button id="reconnect">Reconnect</button><button id="disconnect">Disconnect</button><button id="switch">Switch host</button></div>
<div id="extra"><div class="address"><code id="endpoint">—</code></div><p id="warning" hidden></p><div class="extra-actions"><button id="refresh">Refresh</button><span id="local-tools" hidden><button id="stop">Stop demo</button><button id="publish">Publish</button></span></div></div></section></body></html>
